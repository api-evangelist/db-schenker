aid: db-schenker
url: https://raw.githubusercontent.com/api-evangelist/db-schenker/refs/heads/main/apis.yml
name: DB Schenker
kind: company
description: >-
  DB Schenker (Schenker AG, headquartered in Essen, Germany) is one of the world's
  largest freight forwarders and contract logistics providers, moving air, ocean,
  land and rail freight and running warehousing for shippers across roughly 1,850
  locations. As a forwarder it sits in the intermediation layer of the supply chain
  — between the shipper who owns the cargo and the carriers, terminals and customs
  authorities who move and clear it — buying capacity it does not own and reselling
  visibility it did not have to publish. Its API posture is honestly a customer-contract
  posture, not a public developer posture. Deutsche Bahn sold DB Schenker to DSV A/S,
  completing 30 April 2025, and as of this profile www.dbschenker.com 301-redirects to
  dsv.com while the global developer portal at api-portal.dbschenker.com answers
  HTTP 410 Gone. The one DB Schenker-branded machine-readable API surface still live is
  the Nordic parcel "Partner services API" at parcelservices-se.dbschenker.com/Apipartner,
  which publishes four Swagger 2.0 documents openly but returns 401 on every operation
  without HTTP Basic credentials issued against a signed Swedish transport agreement.
  Its EDI endpoints are proprietary JSON, not EDIFACT or X12, and no DCSA, IATA ONE Record,
  GS1 EPCIS or WCO Data Model conformant contract was found on any reachable host.
