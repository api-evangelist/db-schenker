- aid: db-schenker:db-schenker-partner-services-api-v3
  name: DB Schenker Partner Services API V3
  description: >-
    Version 3 of the Schenker AB (Sweden) Partner services API, adding the parcel-box
    surface used in e-commerce checkout. Six operations across DeliveryPoint/v3:
    GetServicePoint, GetAllServicePoints, GetNearestServicePoint, GetBox,
    GetNearestBoxes and GetNearestTerminal. Backs the DB SCHENKERparcel box product;
    the published Parcelbox-API specification is version 1.3.0. Swagger 2.0, HTTP
    Basic authentication.
  humanURL: https://parcelservices-se.dbschenker.com/Apipartner/swagger/ui/index
  baseURL: https://parcelservices-se.dbschenker.com/Apipartner
  tags:
