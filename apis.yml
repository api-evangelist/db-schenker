apis:
- aid: db-schenker:db-schenker-partner-services-api-v1
  name: DB Schenker Partner Services API V1
  description: >-
    Version 1 of the Schenker AB (Sweden) Partner services API — the Nordic parcel
    network surface inherited from Privpak. Nine operations covering service point
    lookup (DeliveryPoint and ExtendedDeliveryPoint GetAllServicePoints /
    GetNearestServicePoint), shipment registration via POST /Edi/v1/RegisterEdi and
    /Edi/v1/RegisterReturnEdi, QR print codes, sorting-code resolution from
    sender/receiver postal codes and product code, and parcel track-and-trace by
    barcode. Swagger 2.0, HTTPS only, HTTP Basic authentication; every operation
    returned 401 unauthenticated when probed 2026-07-30.
  humanURL: https://parcelservices-se.dbschenker.com/Apipartner/swagger/ui/index
  baseURL: https://parcelservices-se.dbschenker.com/Apipartner
  tags:
  - Parcel
  - Track and Trace
  - EDI
  - Service Points
