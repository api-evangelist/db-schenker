- aid: db-schenker:db-schenker-partner-services-api-v4
  name: DB Schenker Partner Services API V4
  description: >-
    Version 4 of the Schenker AB (Sweden) Partner services API, the current
    CollectionPoint surface (published specification version 4.2.0, document dated
    2025-04-23). Six operations across DeliveryPoint/v4: GetServicePoint,
    GetAllServicePoints, GetNearestServicePoint, GetTerminal, GetAllTerminals and
    GetNearestTerminal — covering DB SCHENKERparcel ombud, ombud Europa, and
    DB SCHENKERparcel / DB SCHENKERsystem with the Collect at terminal option.
    DeliveryPoint v1 and v2 were withdrawn from support on 15 January 2025. Swagger
    2.0, HTTP Basic authentication; a maximum 12-hour cache is mandated on collection
    point data.
  humanURL: https://parcelservices-se.dbschenker.com/Apipartner/swagger/ui/index
  baseURL: https://parcelservices-se.dbschenker.com/Apipartner
