- aid: db-schenker:db-schenker-partner-services-api-v2
  name: DB Schenker Partner Services API V2
  description: >-
    Version 2 of the Schenker AB (Sweden) Partner services API. Four operations:
    DeliveryPoint/v2 GetServicePoint (by four-digit service point number),
    GetAllServicePoints and GetNearestServicePoint, plus
    TrackAndTraceAdvanced/v2/GetParcel which resolves a parcel and its event history
    from a country code, reference type and reference. Read-only polling; no webhook
    or subscription operation is published. Swagger 2.0, HTTP Basic authentication.
  humanURL: https://parcelservices-se.dbschenker.com/Apipartner/swagger/ui/index
  baseURL: https://parcelservices-se.dbschenker.com/Apipartner
  tags:
